openapi: 3.1.0
info:
  title: Jogos API
  description: "API didática para cadastro de jogos, gêneros e fornecedores, movimentaç\
    ões de estoque e pesquisas com filtros, paginação e ordenação. Inclui pessoas,\
    \ clientes, colaboradores e vendas com preço histórico e finalização transacional."
  contact:
    name: Projeto acadêmico Jogos — Sistemas de Informação
  version: 1.0.0
externalDocs:
  description: Repositório e documentação do projeto Jogos
  url: https://github.com/Siunne/Jogos
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Jogos
  description: "Cadastro, manutenção, pesquisa paginada e movimentação de estoque\
    \ de jogos."
- name: Infraestrutura
  description: Verificação simples da disponibilidade HTTP da aplicação.
- name: Fornecedores
  description: Cadastro e consultas dos fornecedores opcionais dos jogos.
- name: Vendas
  description: Operações comerciais de vendas; sem autenticação nesta aula
- name: Pessoas
  description: Operações comerciais de pessoas; sem autenticação nesta aula
- name: Colaboradores
  description: Operações comerciais de colaboradores; sem autenticação nesta aula
- name: Gêneros de jogos
  description: "Cadastro, consulta, pesquisa, status e exclusão de gêneros de jogos."
- name: Clientes
  description: Operações comerciais de clientes; sem autenticação nesta aula
paths:
  /api/pessoas/{id}:
    get:
      tags:
      - Pessoas
      summary: Consultar pessoa
      description: Retorna a identidade civil.
      operationId: consultarPessoa
      parameters:
      - name: id
        in: path
        description: Identificador do recurso
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PessoaResponse"
        "400":
          description: "Dados, parâmetros ou transição comercial inválidos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Exemplo de um cenário possível; mensagens de Bean Validation
                    usam pt-BR
                  value:
                    timestamp: 2026-11-05T12:00:00
                    status: 400
                    error: Bad Request
                    message: "Method parameter 'id': Failed to convert value of type\
                      \ 'java.lang.String' to required type 'java.lang.Long'; For\
                      \ input string: \"abc\""
                    path: /api/pessoas/abc
                    fields: {}
        "404":
          description: Recurso ou referência inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Exemplo de um cenário possível; mensagens de Bean Validation
                    usam pt-BR
                  value:
                    timestamp: 2026-11-05T12:00:00
                    status: 404
                    error: Not Found
                    message: Pessoa não encontrada
                    path: /api/pessoas/1
                    fields: {}
    put:
      tags:
      - Pessoas
      summary: Alterar pessoa
      description: "Substitui nome, email e CPF com validação também no domínio. Preserva\
        \ data/status e vínculos históricos."
      operationId: alterarPessoa
      parameters:
      - name: id
        in: path
        description: Identificador do recurso
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PessoaRequest"
        required: true
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PessoaResponse"
        "400":
          description: "Dados, parâmetros ou transição comercial inválidos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Exemplo de um cenário possível; mensagens de Bean Validation
                    usam pt-BR
                  value:
                    timestamp: 2026-11-05T12:00:00
                    status: 400
                    error: Bad Request
                    message: Dados inválidos
                    path: /api/pessoas/1
                    fields:
                      cpf: CPF inválido
        "404":
          description: Recurso ou referência inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Exemplo de um cenário possível; mensagens de Bean Validation
                    usam pt-BR
                  value:
                    timestamp: 2026-11-05T12:00:00
                    status: 404
                    error: Not Found
                    message: Pessoa não encontrada
                    path: /api/pessoas/1
                    fields: {}
        "409":
          description: Duplicidade ou conflito de integridade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro409:
                  description: Exemplo de um cenário possível; mensagens de Bean Validation
                    usam pt-BR
                  value:
                    timestamp: 2026-11-05T12:00:00
                    status: 409
                    error: Conflict
                    message: CPF já cadastrado
                    path: /api/pessoas/1
                    fields: {}
  /api/pessoas/{id}/status:
    put:
      tags:
      - Pessoas
      summary: Alterar status da pessoa
      description: Inativa ou ativa sem apagar papéis ou vendas. Inativa não participa
        de novas vendas/finalizações.
      operationId: alterarStatusPessoa
      parameters:
      - name: id
        in: path
        description: Identificador do recurso
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
        required: true
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PessoaResponse"
        "400":
          description: "Dados, parâmetros ou transição comercial inválidos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Exemplo de um cenário possível; mensagens de Bean Validation
                    usam pt-BR
                  value:
                    timestamp: 2026-11-05T12:00:00
                    status: 400
                    error: Bad Request
                    message: JSON inválido ou malformado
                    path: /api/pessoas/1/status
                    fields: {}
        "404":
          description: Recurso ou referência inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Exemplo de um cenário possível; mensagens de Bean Validation
                    usam pt-BR
                  value:
                    timestamp: 2026-11-05T12:00:00
                    status: 404
                    error: Not Found
                    message: Pessoa não encontrada
                    path: /api/pessoas/1/status
                    fields: {}
  /api/jogos/{id}:
    get:
      tags:
      - Jogos
      summary: Consultar jogo por ID
      description: "Retorna os dados completos e associações para consulta ou preenchimento\
        \ do formulário. Código, saldo, data e status são apresentados, mas não pertencem\
        \ ao PUT geral."
      operationId: consultarJogo
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JogoResponse"
        "400":
          description: Identificador não numérico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: "Method parameter 'id': Failed to convert value of type\
                      \ 'java.lang.String' to required type 'java.lang.Long'; For\
                      \ input string: \"abc\""
                    path: /api/jogos/abc
                    fields: {}
        "404":
          description: Jogo não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Jogo não encontrado
                    path: /api/jogos/1
                    fields: {}
    put:
      tags:
      - Jogos
      summary: Alterar jogo
      description: "Substitui nome, preço, estoque mínimo, gênero e fornecedor. Preserva\
        \ código, saldo, data de cadastro e status. Fornecedor null ou ausente remove\
        \ a associação. A troca de gênero mantém os dois lados da associação. PUT\
        \ idempotente."
      operationId: alterarJogo
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        description: Representação editável completa; gênero obrigatório e fornecedor
          opcional.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JogoAtualizacaoRequest"
        required: true
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JogoResponse"
        "400":
          description: Dados ou identificador inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: Dados inválidos
                    path: /api/jogos/1
                    fields:
                      nome: não deve estar em branco
        "404":
          description: "Jogo, gênero ou fornecedor não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Jogo não encontrado
                    path: /api/jogos/1
                    fields: {}
        "409":
          description: Conflito de integridade detectado pelo banco
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro409:
                  description: Erro409
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 409
                    error: Conflict
                    message: Operação em conflito com a integridade dos dados
                    path: /api/jogos/1
                    fields: {}
    delete:
      tags:
      - Jogos
      summary: Excluir jogo
      description: "Remove fisicamente o jogo. Sucesso retorna 204 sem corpo; consulta\
        \ posterior retorna 404. Conflitos de integridade, caso detectados pelo banco,\
        \ retornam 409. Não existe regra adicional de jogo em uso neste domínio."
      operationId: excluirJogo
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: "Exclusão concluída, sem corpo"
        "400":
          description: Identificador não numérico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: "Method parameter 'id': Failed to convert value of type\
                      \ 'java.lang.String' to required type 'java.lang.Long'; For\
                      \ input string: \"abc\""
                    path: /api/jogos/abc
                    fields: {}
        "404":
          description: Jogo não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Jogo não encontrado
                    path: /api/jogos/1
                    fields: {}
        "409":
          description: Conflito de integridade detectado pelo banco
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro409:
                  description: Erro409
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 409
                    error: Conflict
                    message: Operação em conflito com a integridade dos dados
                    path: /api/jogos/1
                    fields: {}
  /api/jogos/{id}/status:
    put:
      tags:
      - Jogos
      summary: Alterar status do jogo
      description: Ativa ou inativa o jogo sem excluir o cadastro nem alterar saldo
        ou data. Alterar status não equivale a exclusão física.
      operationId: alterarStatusJogo
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        description: "Status obrigatório: ATIVO ou INATIVO."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
        required: true
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JogoResponse"
        "400":
          description: Status ausente/inválido ou identificador inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: JSON inválido ou malformado
                    path: /api/jogos/1/status
                    fields: {}
        "404":
          description: Jogo não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Jogo não encontrado
                    path: /api/jogos/1/status
                    fields: {}
  /api/generos/{id}:
    get:
      tags:
      - Gêneros de jogos
      summary: Consultar gênero por ID
      description: Retorna o gênero com nome e status para consulta e preenchimento
        do formulário de alteração.
      operationId: consultarGenero
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneroJogoResponse"
        "400":
          description: Identificador não numérico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: "Method parameter 'id': Failed to convert value of type\
                      \ 'java.lang.String' to required type 'java.lang.Long'; For\
                      \ input string: \"abc\""
                    path: /api/generos/abc
                    fields: {}
        "404":
          description: Gênero não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Gênero de jogo não encontrado
                    path: /api/generos/1
                    fields: {}
    put:
      tags:
      - Gêneros de jogos
      summary: Alterar gênero
      description: "Substitui o nome do gênero, normalizando espaços externos e verificando\
        \ duplicidade sem considerar o próprio ID. PUT idempotente; preserva status."
      operationId: alterarGenero
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        description: "Representação editável: nome obrigatório, até 120 caracteres."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneroJogoAtualizacaoRequest"
        required: true
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneroJogoResponse"
        "400":
          description: Nome ou identificador inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: Dados inválidos
                    path: /api/generos/1
                    fields:
                      nome: não deve estar em branco
        "404":
          description: Gênero não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Gênero de jogo não encontrado
                    path: /api/generos/1
                    fields: {}
        "409":
          description: Nome normalizado já cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro409:
                  description: Erro409
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 409
                    error: Conflict
                    message: Nome do gênero já cadastrado
                    path: /api/generos/1
                    fields: {}
    delete:
      tags:
      - Gêneros de jogos
      summary: Excluir gênero
      description: Exclui fisicamente somente gênero sem jogos. Gênero em uso gera
        409; para mantê-lo e preservar vínculos use a operação de status. Sucesso
        não possui corpo.
      operationId: excluirGenero
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: "Exclusão concluída, sem corpo"
        "400":
          description: Identificador não numérico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: "Method parameter 'id': Failed to convert value of type\
                      \ 'java.lang.String' to required type 'java.lang.Long'; For\
                      \ input string: \"abc\""
                    path: /api/generos/abc
                    fields: {}
        "404":
          description: Gênero não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Gênero de jogo não encontrado
                    path: /api/generos/1
                    fields: {}
        "409":
          description: Gênero possui jogos ou conflito de integridade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro409:
                  description: Erro409
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 409
                    error: Conflict
                    message: Gênero não pode ser excluído porque possui jogos
                    path: /api/generos/1
                    fields: {}
  /api/generos/{id}/status:

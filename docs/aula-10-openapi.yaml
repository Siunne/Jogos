components:
  schemas:
    PessoaRequest:
      type: object
      description: Criação/alteração da identidade. CPF com DVs válidos e sem pontuação;
        data/status controlados pelo servidor.
      properties:
        nome:
          type: string
          description: Nome civil obrigatório; não aceita vazio ou somente espaços
          example: Pessoa Exemplo
          maxLength: 150
          minLength: 1
          pattern: "^(?![\\u0000-\\u0020]*[\\u0009-\\u000D\\u001C-\\u0020\\u1680\\\
            u2000-\\u2006\\u2008-\\u200A\\u2028\\u2029\\u205F\\u3000]*[\\u0000-\\\
            u0020]*(?![\\s\\S]))[\\s\\S]+(?![\\s\\S])"
        email:
          type: string
          format: email
          description: "E-mail único, normalizado em minúsculas; limite de 180 caracteres\
            \ também após normalização; não aceita vazio ou somente espaços"
          example: pessoa@example.com
          maxLength: 180
          minLength: 1
          pattern: "^(?![\\u0000-\\u0020]*[\\u0009-\\u000D\\u001C-\\u0020\\u1680\\\
            u2000-\\u2006\\u2008-\\u200A\\u2028\\u2029\\u205F\\u3000]*[\\u0000-\\\
            u0020]*(?![\\s\\S]))[\\s\\S]+(?![\\s\\S])"
        cpf:

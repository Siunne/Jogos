  /api/generos:
    get:
      tags:
      - Gêneros de jogos
      summary: Pesquisar gêneros
      description: "Combina nome e status no banco. Página base zero, padrão 20, má\
        ximo 100. Ordenação permitida: id, nome, status. Retorna PaginaResponse, nã\
        o Page do Spring."
      operationId: pesquisarGeneros
      parameters:
      - name: nome
        in: query
        description: "Trecho do nome, sem diferenciar caixa; espaços externos são\
          \ ignorados"
        required: false
        schema:
          type: string
        example: aventura
      - name: status
        in: query
        description: Filtra por ATIVO ou INATIVO; outro valor retorna 400
        required: false
        schema:
          type: string
          enum:
          - ATIVO
          - INATIVO
        example: ATIVO
      - name: page
        in: query
        description: Página iniciada em zero; valor negativo ou não inteiro retorna
          400
        schema:
          type: integer
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        description: "Tamanho da página: padrão 20, entre 1 e 100; fora do intervalo\
          \ retorna 400"
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
        example: 20
      - name: sort
        in: query
        description: "Ordenação campo,asc ou campo,desc; repetir sort para vários\
          \ campos. Padrão id,asc. Campos permitidos descritos na operação; caminhos\
          \ arbitrários retornam 400"
        schema:
          type: array
          items:
            type: string
        example:
        - "nome,asc"
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaResponseGeneroJogoResponse"
        "400":
          description: "Filtro, paginação ou ordenação inválidos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: page deve estar entre 0 e 2147483647
                    path: /api/generos
                    fields: {}
    post:
      tags:
      - Gêneros de jogos
      summary: Cadastrar gênero
      description: Cria gênero ATIVO. Nome único após ignorar caixa e espaços externos;
        cadastro permite até 100 caracteres.
      operationId: cadastrarGenero
      requestBody:
        description: Dados do gênero; não recebe status.
        content:
          application/json:

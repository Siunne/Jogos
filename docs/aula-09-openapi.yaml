components:
  schemas:
    JogoAtualizacaoRequest:
      type: object
      description: "Representação editável completa. Não altera código, saldo, data\
        \ de cadastro nem status."
      properties:
        nome:
          type: string
          description: "Novo nome do jogo; obrigatório, não aceita texto vazio ou\
            \ formado somente por espaços em branco"
          example: Reino das Estrelas — Edição Completa
          maxLength: 150
          minLength: 1
          pattern: "[\\s\\S]*[^\\u0009-\\u000D\\u001C-\\u0020\\u1680\\u2000-\\u2006\\\
            u2008-\\u200A\\u2028\\u2029\\u205F\\u3000][\\s\\S]*"
        preco:
          type: number
          description: Novo preço; até 16 dígitos inteiros e 2 decimais
          example: 149.9
          maximum: 9999999999999999.99
          minimum: 0
          multipleOf: 0.01
        estoqueMinimo:
          type: number
          description: Novo mínimo; até 15 dígitos inteiros e 3 decimais
          example: 3.0
          maximum: 999999999999999.999
          minimum: 0
          multipleOf: 0.001
        generoId:
          type: integer
          format: int64
          description: Identificador positivo do gênero de destino
          example: 1
          minimum: 1
        fornecedorId:
          type:
          - integer
          - "null"
          format: int64
          description: Identificador positivo opcional; null ou ausência remove a
            associação
          example: null
          minimum: 1
      required:
      - estoqueMinimo
      - generoId
      - nome
      - preco
    ApiError:
      type: object
      description: Erro HTTP padronizado; campos correspondem ao ApiExceptionHandler
        real.
      properties:
        timestamp:
          type: string
          format: local-date-time
          description: "Data e hora locais do servidor, sem offset; formato ISO LocalDateTime"
          example: 2026-11-04T18:30:00
        status:
          type: integer
          format: int32
          description: Código de status HTTP
          example: 400
          maximum: 599
          minimum: 100
        error:
          type: string
          description: Nome do status HTTP
          example: Bad Request
        message:
          type: string
          description: "Mensagem da validação, regra de negócio ou recurso inexistente"
          example: Unidades disponíveis insuficientes
        path:
          type: string
          description: Caminho HTTP da requisição que falhou
          example: /api/jogos/1/estoque/saidas
        fields:
          type: object
          additionalProperties:
            type: string
          description: Mensagens por campo em erros de validação; objeto vazio nos
            demais casos
          example: {}
      required:
      - error
      - fields
      - message
      - path
      - status
      - timestamp
    JogoResponse:
      type: object
      description: "Representação completa de jogo, incluindo campos protegidos e\
        \ associações."
      properties:
        id:
          type: integer
          format: int64
          description: Identificador gerado pelo servidor
          example: 1
          readOnly: true
        codigo:
          type: string
          description: "Código único, imutável depois do cadastro"
          example: JOGO-ESTRELAS-001
        nome:
          type: string
          description: Nome comercial do jogo
          example: Reino das Estrelas
        preco:
          type: number
          description: "Preço por unidade, não negativo"
          example: 149.9
          minimum: 0
        estoqueMinimo:
          type: number
          description: Quantidade mínima usada para indicar reposição
          example: 3.0
          minimum: 0
        generoId:
          type: integer
          format: int64
          description: Identificador de um gênero existente
          example: 1
        generoNome:
          type: string
          description: Nome do gênero associado
          example: Aventura
        fornecedorId:
          type:
          - integer
          - "null"
          format: int64
          description: Fornecedor opcional; null ou ausência remove/dispensa a associação
          example: 1
        fornecedorRazaoSocial:
          type:
          - string
          - "null"
          description: Razão social opcional; null quando não há fornecedor
          example: Distribuidora Exemplo de Jogos
        unidadesDisponiveis:
          type: number
          description: Saldo atual; modificado somente por entrada ou saída
          example: 10.0
          minimum: 0
        dataCadastro:
          type: string
          format: date
          description: Data local gerada pelo servidor; preservada em todas as atualizações
          example: 2026-11-04
          readOnly: true
        status:
          type: string
          description: Situação do cadastro; alterada somente pela operação de status
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
      required:
      - codigo
      - dataCadastro
      - estoqueMinimo
      - generoId
      - generoNome
      - id
      - nome
      - preco
      - status
      - unidadesDisponiveis
    StatusRequest:
      type: object
      description: Ativação ou inativação; mantém o registro e seus relacionamentos.
      properties:
        status:
          type: string
          description: Situação do cadastro; alterada somente pela operação de status
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
      required:
      - status
    GeneroJogoAtualizacaoRequest:
      type: object
      description: Atualização do nome do gênero; não altera o status.
      properties:
        nome:
          type: string
          description: "Nome do gênero; atualização permite até 120 caracteres; obrigató\
            rio, não aceita texto vazio ou formado somente por espaços em branco"
          example: Aventura e exploração
          maxLength: 120
          minLength: 1
          pattern: "[\\s\\S]*[^\\u0009-\\u000D\\u001C-\\u0020\\u1680\\u2000-\\u2006\\\
            u2008-\\u200A\\u2028\\u2029\\u205F\\u3000][\\s\\S]*"
      required:
      - nome
    GeneroJogoResponse:
      type: object
      description: Representação de gênero usada nas consultas e alterações.
      properties:
        id:
          type: integer
          format: int64
          description: Identificador gerado pelo servidor
          example: 1
          readOnly: true
        nome:
          type: string
          description: Nome normalizado do gênero
          example: Aventura
        status:
          type: string
          description: Situação do cadastro; alterada somente pela operação de status
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
      required:
      - id
      - nome
      - status
    JogoRequest:
      type: object
      description: Criação de jogo ativo. A data é definida pelo servidor e não é
        aceita neste DTO. Fornecedor opcional.
      properties:
        codigo:
          type: string
          description: "Código único escolhido no cadastro; imutável depois da criaç\
            ão; obrigatório, não aceita texto vazio ou formado somente por espaços\
            \ em branco"
          example: JOGO-ESTRELAS-001
          maxLength: 50
          minLength: 1
          pattern: "[\\s\\S]*[^\\u0009-\\u000D\\u001C-\\u0020\\u1680\\u2000-\\u2006\\\
            u2008-\\u200A\\u2028\\u2029\\u205F\\u3000][\\s\\S]*"
        nome:
          type: string
          description: "Nome do jogo; obrigatório, não aceita texto vazio ou formado\
            \ somente por espaços em branco"
          example: Reino das Estrelas
          maxLength: 150
          minLength: 1
          pattern: "[\\s\\S]*[^\\u0009-\\u000D\\u001C-\\u0020\\u1680\\u2000-\\u2006\\\
            u2008-\\u200A\\u2028\\u2029\\u205F\\u3000][\\s\\S]*"
        unidadesDisponiveis:
          type: number
          description: Saldo inicial não negativo; depois muda somente por movimentação
          example: 10.0
          minimum: 0
        preco:
          type: number
          description: "Preço por unidade, não negativo"
          example: 149.9
          minimum: 0
        estoqueMinimo:
          type: number
          description: Quantidade mínima usada para indicar reposição
          example: 3.0
          minimum: 0
        generoId:
          type: integer
          format: int64
          description: Identificador de um gênero existente
          example: 1
        fornecedorId:
          type:
          - integer
          - "null"
          format: int64
          description: Fornecedor opcional; null ou ausência remove/dispensa a associação
          example: null
      required:
      - codigo
      - estoqueMinimo
      - generoId
      - nome
      - preco
      - unidadesDisponiveis
    MovimentacaoEstoqueRequest:
      type: object
      description: "Quantidade positiva para movimento acumulativo, não idempotente."
      properties:
        quantidade:
          type: number
          description: Quantidade maior que zero; até 15 dígitos inteiros e 3 decimais
          example: 5.0
          exclusiveMinimum: 0
          maximum: 999999999999999.999
          multipleOf: 0.001
      required:
      - quantidade
    GeneroJogoRequest:
      type: object
      description: "Cadastro de gênero ativo com nome único, ignorando caixa e espaç\
        os externos."
      properties:
        nome:
          type: string
          description: "Nome do gênero; cadastro permite até 100 caracteres; obrigató\
            rio, não aceita texto vazio ou formado somente por espaços em branco"
          example: Aventura
          maxLength: 100
          minLength: 1
          pattern: "[\\s\\S]*[^\\u0009-\\u000D\\u001C-\\u0020\\u1680\\u2000-\\u2006\\\
            u2008-\\u200A\\u2028\\u2029\\u205F\\u3000][\\s\\S]*"
      required:

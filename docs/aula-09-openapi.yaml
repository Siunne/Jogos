openapi: 3.1.0
info:
  title: Jogos API
  description: "API didática para cadastro de jogos, gêneros e fornecedores, movimentaç\
    ões de estoque e pesquisas com filtros, paginação e ordenação."
  contact:
    name: Projeto acadêmico Jogos — Sistemas de Informação
  version: 1.0.0
externalDocs:
  description: Repositório e documentação do projeto Jogos
  url: https://github.com/Siunne/Jogos
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Jogos
  description: "Cadastro, manutenção, pesquisa paginada e movimentação de estoque\
    \ de jogos."
- name: Infraestrutura
  description: Verificação simples da disponibilidade HTTP da aplicação.
- name: Fornecedores
  description: Cadastro e consultas dos fornecedores opcionais dos jogos.
- name: Gêneros de jogos
  description: "Cadastro, consulta, pesquisa, status e exclusão de gêneros de jogos."
paths:
  /api/jogos/{id}:
    get:
      tags:
      - Jogos
      summary: Consultar jogo por ID
      description: "Retorna os dados completos e associações para consulta ou preenchimento\
        \ do formulário. Código, saldo, data e status são apresentados, mas não pertencem\
        \ ao PUT geral."
      operationId: consultarJogo
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JogoResponse"
        "400":
          description: Identificador não numérico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: "Method parameter 'id': Failed to convert value of type\
                      \ 'java.lang.String' to required type 'java.lang.Long'; For\
                      \ input string: \"abc\""
                    path: /api/jogos/abc
                    fields: {}
        "404":
          description: Jogo não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Jogo não encontrado
                    path: /api/jogos/1
                    fields: {}
    put:
      tags:
      - Jogos
      summary: Alterar jogo
      description: "Substitui nome, preço, estoque mínimo, gênero e fornecedor. Preserva\
        \ código, saldo, data de cadastro e status. Fornecedor null ou ausente remove\
        \ a associação. A troca de gênero mantém os dois lados da associação. PUT\
        \ idempotente."
      operationId: alterarJogo
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        description: Representação editável completa; gênero obrigatório e fornecedor
          opcional.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JogoAtualizacaoRequest"
        required: true
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JogoResponse"
        "400":
          description: Dados ou identificador inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: Dados inválidos
                    path: /api/jogos/1
                    fields:
                      nome: não deve estar em branco
        "404":
          description: "Jogo, gênero ou fornecedor não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Jogo não encontrado
                    path: /api/jogos/1
                    fields: {}
        "409":
          description: Conflito de integridade detectado pelo banco
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro409:
                  description: Erro409
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 409
                    error: Conflict
                    message: Operação em conflito com a integridade dos dados
                    path: /api/jogos/1
                    fields: {}
    delete:
      tags:
      - Jogos
      summary: Excluir jogo
      description: "Remove fisicamente o jogo. Sucesso retorna 204 sem corpo; consulta\
        \ posterior retorna 404. Conflitos de integridade, caso detectados pelo banco,\
        \ retornam 409. Não existe regra adicional de jogo em uso neste domínio."
      operationId: excluirJogo
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: "Exclusão concluída, sem corpo"
        "400":
          description: Identificador não numérico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: "Method parameter 'id': Failed to convert value of type\
                      \ 'java.lang.String' to required type 'java.lang.Long'; For\
                      \ input string: \"abc\""
                    path: /api/jogos/abc
                    fields: {}
        "404":
          description: Jogo não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Jogo não encontrado
                    path: /api/jogos/1
                    fields: {}
        "409":
          description: Conflito de integridade detectado pelo banco
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro409:
                  description: Erro409
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 409
                    error: Conflict
                    message: Operação em conflito com a integridade dos dados
                    path: /api/jogos/1
                    fields: {}
  /api/jogos/{id}/status:
    put:
      tags:
      - Jogos
      summary: Alterar status do jogo
      description: Ativa ou inativa o jogo sem excluir o cadastro nem alterar saldo
        ou data. Alterar status não equivale a exclusão física.
      operationId: alterarStatusJogo
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        description: "Status obrigatório: ATIVO ou INATIVO."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
        required: true
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JogoResponse"
        "400":
          description: Status ausente/inválido ou identificador inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: JSON inválido ou malformado
                    path: /api/jogos/1/status
                    fields: {}
        "404":
          description: Jogo não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Jogo não encontrado
                    path: /api/jogos/1/status
                    fields: {}
  /api/generos/{id}:
    get:
      tags:
      - Gêneros de jogos
      summary: Consultar gênero por ID
      description: Retorna o gênero com nome e status para consulta e preenchimento
        do formulário de alteração.
      operationId: consultarGenero
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneroJogoResponse"
        "400":
          description: Identificador não numérico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: "Method parameter 'id': Failed to convert value of type\
                      \ 'java.lang.String' to required type 'java.lang.Long'; For\
                      \ input string: \"abc\""
                    path: /api/generos/abc
                    fields: {}
        "404":
          description: Gênero não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Gênero de jogo não encontrado
                    path: /api/generos/1
                    fields: {}
    put:
      tags:
      - Gêneros de jogos
      summary: Alterar gênero
      description: "Substitui o nome do gênero, normalizando espaços externos e verificando\
        \ duplicidade sem considerar o próprio ID. PUT idempotente; preserva status."
      operationId: alterarGenero
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        description: "Representação editável: nome obrigatório, até 120 caracteres."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneroJogoAtualizacaoRequest"
        required: true
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneroJogoResponse"
        "400":
          description: Nome ou identificador inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: Dados inválidos
                    path: /api/generos/1
                    fields:
                      nome: não deve estar em branco
        "404":
          description: Gênero não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Gênero de jogo não encontrado
                    path: /api/generos/1
                    fields: {}
        "409":
          description: Nome normalizado já cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro409:
                  description: Erro409
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 409
                    error: Conflict
                    message: Nome do gênero já cadastrado
                    path: /api/generos/1
                    fields: {}
    delete:
      tags:
      - Gêneros de jogos
      summary: Excluir gênero
      description: Exclui fisicamente somente gênero sem jogos. Gênero em uso gera
        409; para mantê-lo e preservar vínculos use a operação de status. Sucesso
        não possui corpo.
      operationId: excluirGenero
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: "Exclusão concluída, sem corpo"
        "400":
          description: Identificador não numérico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: "Method parameter 'id': Failed to convert value of type\
                      \ 'java.lang.String' to required type 'java.lang.Long'; For\
                      \ input string: \"abc\""
                    path: /api/generos/abc
                    fields: {}
        "404":
          description: Gênero não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Gênero de jogo não encontrado
                    path: /api/generos/1
                    fields: {}
        "409":
          description: Gênero possui jogos ou conflito de integridade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro409:
                  description: Erro409
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 409
                    error: Conflict
                    message: Gênero não pode ser excluído porque possui jogos
                    path: /api/generos/1
                    fields: {}
  /api/generos/{id}/status:
    put:
      tags:
      - Gêneros de jogos
      summary: Alterar status do gênero
      description: Ativa ou inativa sem excluir fisicamente ou remover jogos associados.
        Repetir o mesmo status mantém o estado final.
      operationId: alterarStatusGenero
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        description: "Status obrigatório: ATIVO ou INATIVO."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
        required: true
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneroJogoResponse"
        "400":
          description: Status ausente/inválido ou identificador inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: JSON inválido ou malformado
                    path: /api/generos/1/status
                    fields: {}
        "404":
          description: Gênero não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Gênero de jogo não encontrado
                    path: /api/generos/1/status
                    fields: {}
  /api/jogos:
    get:
      tags:
      - Jogos
      summary: Pesquisar jogos
      description: "Combina nome, status, generoId, fornecedorId e abaixoEstoqueMinimo\
        \ no banco. Não existe filtro por preço. Página base zero, padrão 20, máximo\
        \ 100. Ordenação permitida: id, nome, codigo, preco, estoqueMinimo, unidadesDisponiveis,\
        \ dataCadastro, status. Retorna os sete campos de PaginaResponse."
      operationId: pesquisarJogos
      parameters:
      - name: nome
        in: query
        description: "Trecho do nome, sem diferenciar caixa; espaços externos são\
          \ ignorados"
        required: false
        schema:
          type: string
        example: estrelas
      - name: status
        in: query
        description: Filtra por ATIVO ou INATIVO; outro valor retorna 400
        required: false
        schema:
          type: string
          enum:
          - ATIVO
          - INATIVO
        example: ATIVO
      - name: generoId
        in: query
        description: Identificador exato do gênero; ausência não restringe a consulta
        required: false
        schema:
          type: integer
          format: int64
        example: 1
      - name: fornecedorId
        in: query
        description: Identificador exato do fornecedor; ausência não restringe a consulta
        required: false
        schema:
          type: integer
          format: int64
        example: 1
      - name: abaixoEstoqueMinimo
        in: query
        description: true exige saldo estritamente menor que o mínimo; false ou ausência
          não restringe o saldo
        required: false
        schema:
          type: boolean
        example: true
      - name: page
        in: query
        description: Página iniciada em zero; valor negativo ou não inteiro retorna
          400
        schema:
          type: integer
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        description: "Tamanho da página: padrão 20, entre 1 e 100; fora do intervalo\
          \ retorna 400"
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
        example: 20
      - name: sort
        in: query
        description: "Ordenação campo,asc ou campo,desc; repetir sort para vários\
          \ campos. Padrão id,asc. Campos permitidos descritos na operação; caminhos\
          \ arbitrários retornam 400"
        schema:
          type: array
          items:
            type: string
        example:
        - "nome,asc"
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaResponseJogoResponse"
        "400":
          description: "Filtro, paginação ou ordenação inválidos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: page deve estar entre 0 e 2147483647
                    path: /api/jogos
                    fields: {}
    post:
      tags:
      - Jogos
      summary: Cadastrar jogo
      description: Cria jogo ATIVO com gênero existente e fornecedor opcional. A data
        de cadastro é definida pelo servidor; não é enviada pelo cliente. Código é
        único; saldo inicial e mínimo não podem ser negativos.
      operationId: cadastrarJogo
      requestBody:
        description: Dados de criação sem dataCadastro e status; fornecedorId pode
          ser null ou omitido.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JogoRequest"
        required: true
      responses:
        "201":
          description: Cadastro concluído
          headers:
            Location:
              description: URI relativa do recurso criado
              style: simple
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JogoResponse"
        "400":
          description: Dados ou JSON inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: Dados inválidos
                    path: /api/jogos
                    fields:
                      nome: O nome é obrigatório
        "404":
          description: Gênero ou fornecedor não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Gênero de jogo não encontrado
                    path: /api/jogos
                    fields: {}
        "409":
          description: Código já cadastrado ou conflito de integridade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro409:
                  description: Erro409
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 409
                    error: Conflict
                    message: Código do jogo já cadastrado
                    path: /api/jogos
                    fields: {}
  /api/jogos/{id}/estoque/saidas:
    post:
      tags:
      - Jogos
      summary: Registrar saída de estoque
      description: Subtrai quantidade positiva do saldo. Operação acumulativa e não
        idempotente. Saldo insuficiente retorna 400 sem alterar o saldo; o estoque
        nunca pode ficar negativo. Quantidades inválidas são rejeitadas.
      operationId: saidaEstoque
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        description: Quantidade positiva que não pode superar o saldo disponível.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovimentacaoEstoqueRequest"
        required: true
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JogoResponse"
        "400":
          description: Quantidade inválida ou unidades disponíveis insuficientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro400:
                  description: Erro400
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 400
                    error: Bad Request
                    message: Dados inválidos
                    path: /api/jogos/1/estoque/saidas
                    fields:
                      quantidade: deve ser maior que 0
        "404":
          description: Jogo não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Erro404:
                  description: Erro404
                  value:
                    timestamp: 2026-11-04T18:30:00
                    status: 404
                    error: Not Found
                    message: Jogo não encontrado
                    path: /api/jogos/1/estoque/saidas
                    fields: {}
  /api/jogos/{id}/estoque/entradas:
    post:
      tags:
      - Jogos
      summary: Registrar entrada de estoque
      description: "Soma quantidade positiva ao saldo atual. Operação não idempotente\
        \ e acumulativa: repetir a chamada repete o efeito. Quantidade zero, negativa,\
        \ ausente ou com mais de três casas decimais é rejeitada."
      operationId: entradaEstoque
      parameters:
      - name: id
        in: path
        description: "Identificador do recurso, representado por Long"
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        description: "Quantidade positiva, com no máximo três casas decimais."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovimentacaoEstoqueRequest"
        required: true
      responses:
        "200":
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JogoResponse"
        "400":
          description: Quantidade ou identificador inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_DEV_URL:jdbc:postgresql://localhost:5432/jogos_dev}
spring.datasource.username=${DB_DEV_USERNAME:jogos_app}
spring.datasource.password=${DB_DEV_PASSWORD}

# SQL direto em stdout não passa pelo filtro de privacidade do Logback.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.liquibase=INFO

databaseChangeLog:
  - changeSet:
      id: 005-1-create-pessoa
      author: emilly
      changes:
        - createTable:
            tableName: pessoa
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_pessoa
                    nullable: false
              - column:
                  name: nome
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(180)
                  constraints:
                    nullable: false
              - column:
                  name: cpf
                  type: VARCHAR(11)
                  constraints:
                    nullable: false
              - column:
                  name: data_cadastro
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: pessoa
  - changeSet:
      id: 005-2-create-cliente
      author: emilly
      changes:
        - createTable:
            tableName: cliente
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_cliente
                    nullable: false
              - column:
                  name: pessoa_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: telefone
                  type: VARCHAR(30)
                  constraints:
                    nullable: true
      rollback:
        - dropTable:
            tableName: cliente
  - changeSet:
      id: 005-3-create-colaborador
      author: emilly
      changes:
        - createTable:
            tableName: colaborador
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_colaborador
                    nullable: false
              - column:
                  name: pessoa_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: matricula
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: funcao
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: data_admissao
                  type: DATE
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: colaborador
  - changeSet:
      id: 005-4-create-venda
      author: emilly
      changes:
        - createTable:
            tableName: venda
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_venda
                    nullable: false
              - column:
                  name: cliente_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: vendedor_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: data_venda
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: venda
  - changeSet:
      id: 005-5-create-item_venda
      author: emilly
      changes:
        - createTable:
            tableName: item_venda
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_item_venda
                    nullable: false
              - column:
                  name: venda_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: jogo_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantidade
                  type: NUMERIC(18,3)
                  constraints:
                    nullable: false
              - column:
                  name: valor_unitario
                  type: NUMERIC(18,2)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: item_venda
  - changeSet:
      id: 005-6-uk_pessoa_cpf
      author: emilly
      changes:
        - addUniqueConstraint:
            tableName: pessoa
            columnNames: cpf
            constraintName: uk_pessoa_cpf
      rollback:
        - dropUniqueConstraint:
            tableName: pessoa
            constraintName: uk_pessoa_cpf
  - changeSet:
      id: 005-7-uk_cliente_pessoa_id
      author: emilly
      changes:
        - addUniqueConstraint:
            tableName: cliente
            columnNames: pessoa_id
            constraintName: uk_cliente_pessoa_id
      rollback:
        - dropUniqueConstraint:
            tableName: cliente
            constraintName: uk_cliente_pessoa_id
  - changeSet:
      id: 005-8-uk_colaborador_pessoa_id
      author: emilly
      changes:
        - addUniqueConstraint:
            tableName: colaborador
            columnNames: pessoa_id
            constraintName: uk_colaborador_pessoa_id
      rollback:
        - dropUniqueConstraint:
            tableName: colaborador
            constraintName: uk_colaborador_pessoa_id
  - changeSet:
      id: 005-9-uk_colaborador_matricula
      author: emilly
      changes:
        - addUniqueConstraint:
            tableName: colaborador
            columnNames: matricula
            constraintName: uk_colaborador_matricula
      rollback:
        - dropUniqueConstraint:
            tableName: colaborador
            constraintName: uk_colaborador_matricula
  - changeSet:
      id: 005-10-uk_item_venda_venda_id_jogo_id
      author: emilly
      changes:
        - addUniqueConstraint:
            tableName: item_venda
            columnNames: venda_id, jogo_id
            constraintName: uk_item_venda_venda_id_jogo_id
      rollback:
        - dropUniqueConstraint:
            tableName: item_venda
            constraintName: uk_item_venda_venda_id_jogo_id
  - changeSet:
      id: 005-11-email-normalizado
      author: emilly
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX uk_pessoa_email_normalizado ON pessoa (lower(btrim(email)))
      rollback:
        - sql:
            sql: DROP INDEX uk_pessoa_email_normalizado
  - changeSet:
      id: 005-12-fk_cliente_pessoa_id
      author: emilly
      changes:
        - addForeignKeyConstraint:
            baseTableName: cliente
            baseColumnNames: pessoa_id
            referencedTableName: pessoa
            referencedColumnNames: id
            constraintName: fk_cliente_pessoa_id
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: cliente
            constraintName: fk_cliente_pessoa_id
  - changeSet:
      id: 005-13-fk_colaborador_pessoa_id
      author: emilly
      changes:
        - addForeignKeyConstraint:
            baseTableName: colaborador
            baseColumnNames: pessoa_id
            referencedTableName: pessoa
            referencedColumnNames: id
            constraintName: fk_colaborador_pessoa_id
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: colaborador
            constraintName: fk_colaborador_pessoa_id
  - changeSet:
      id: 005-14-fk_venda_cliente_id
      author: emilly
      changes:
        - addForeignKeyConstraint:
            baseTableName: venda
            baseColumnNames: cliente_id
            referencedTableName: cliente
            referencedColumnNames: id
            constraintName: fk_venda_cliente_id
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: venda
            constraintName: fk_venda_cliente_id
  - changeSet:
      id: 005-15-fk_venda_vendedor_id
      author: emilly
      changes:
        - addForeignKeyConstraint:
            baseTableName: venda
            baseColumnNames: vendedor_id
            referencedTableName: colaborador
            referencedColumnNames: id
            constraintName: fk_venda_vendedor_id
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: venda
            constraintName: fk_venda_vendedor_id
  - changeSet:
      id: 005-16-fk_item_venda_venda_id
      author: emilly
      changes:
        - addForeignKeyConstraint:
            baseTableName: item_venda
            baseColumnNames: venda_id
            referencedTableName: venda
            referencedColumnNames: id
            constraintName: fk_item_venda_venda_id
            onDelete: CASCADE
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: item_venda
            constraintName: fk_item_venda_venda_id
  - changeSet:
      id: 005-17-fk_item_venda_jogo_id
      author: emilly
      changes:
        - addForeignKeyConstraint:
            baseTableName: item_venda
            baseColumnNames: jogo_id
            referencedTableName: jogo
            referencedColumnNames: id
            constraintName: fk_item_venda_jogo_id
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: item_venda
            constraintName: fk_item_venda_jogo_id
  - changeSet:
      id: 005-18-ck_pessoa_cpf_formato
      author: emilly
      changes:
        - sql:
            sql: ALTER TABLE pessoa ADD CONSTRAINT ck_pessoa_cpf_formato CHECK (cpf ~ '^[0-9]{11}$')
      rollback:
        - sql:
            sql: ALTER TABLE pessoa DROP CONSTRAINT ck_pessoa_cpf_formato
  - changeSet:
      id: 005-19-ck_pessoa_email_normalizado
      author: emilly
      changes:
        - sql:
            sql: ALTER TABLE pessoa ADD CONSTRAINT ck_pessoa_email_normalizado CHECK (email = lower(btrim(email)) AND length(email) > 0)
      rollback:
        - sql:
            sql: ALTER TABLE pessoa DROP CONSTRAINT ck_pessoa_email_normalizado
  - changeSet:
      id: 005-20-ck_pessoa_status
      author: emilly
      changes:
        - sql:
            sql: ALTER TABLE pessoa ADD CONSTRAINT ck_pessoa_status CHECK (status IN ('ATIVO','INATIVO'))
      rollback:
        - sql:
            sql: ALTER TABLE pessoa DROP CONSTRAINT ck_pessoa_status
  - changeSet:
      id: 005-21-ck_colaborador_funcao
      author: emilly
      changes:
        - sql:
            sql: ALTER TABLE colaborador ADD CONSTRAINT ck_colaborador_funcao CHECK (funcao IN ('VENDEDOR','ESTOQUISTA','GERENTE','ADMINISTRATIVO'))
      rollback:
        - sql:
            sql: ALTER TABLE colaborador DROP CONSTRAINT ck_colaborador_funcao
  - changeSet:
      id: 005-22-ck_venda_status
      author: emilly
      changes:
        - sql:
            sql: ALTER TABLE venda ADD CONSTRAINT ck_venda_status CHECK (status IN ('ABERTA','FINALIZADA','CANCELADA'))
      rollback:
        - sql:
            sql: ALTER TABLE venda DROP CONSTRAINT ck_venda_status
  - changeSet:
      id: 005-23-ck_item_venda_quantidade
      author: emilly
      changes:
        - sql:
            sql: ALTER TABLE item_venda ADD CONSTRAINT ck_item_venda_quantidade CHECK (quantidade > 0)
      rollback:
        - sql:
            sql: ALTER TABLE item_venda DROP CONSTRAINT ck_item_venda_quantidade
  - changeSet:
      id: 005-24-ck_item_venda_preco
      author: emilly
      changes:
        - sql:
            sql: ALTER TABLE item_venda ADD CONSTRAINT ck_item_venda_preco CHECK (valor_unitario >= 0)
      rollback:
        - sql:
            sql: ALTER TABLE item_venda DROP CONSTRAINT ck_item_venda_preco

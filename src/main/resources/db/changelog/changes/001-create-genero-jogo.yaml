databaseChangeLog:
  - changeSet:
      id: 001-01-create-genero-jogo
      author: emilly
      changes:
        - createTable:
            tableName: genero_jogo
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_genero_jogo
                    nullable: false
              - column:
                  name: nome
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: genero_jogo

  - changeSet:
      id: 001-02-check-status-genero-jogo
      author: emilly
      changes:
        - sql:
            sql: >
              ALTER TABLE genero_jogo
              ADD CONSTRAINT ck_genero_jogo_status
              CHECK (status IN ('ATIVO', 'INATIVO'));
      rollback:
        - sql:
            sql: >
              ALTER TABLE genero_jogo
              DROP CONSTRAINT ck_genero_jogo_status;
databaseChangeLog:
  - changeSet:
      id: 003-01
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: fornecedor
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_fornecedor

              - column:
                  name: razao_social
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: cnpj
                  type: VARCHAR(14)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-02
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE fornecedor
              ADD CONSTRAINT ck_fornecedor_status
              CHECK (status IN ('ATIVO', 'INATIVO'));

  - changeSet:
      id: 003-03
      author: curso-spring-2026
      changes:
        - addUniqueConstraint:
            tableName: fornecedor
            columnNames: cnpj
            constraintName: uk_fornecedor_cnpj

  - changeSet:
      id: 003-04
      author: curso-spring-2026
      changes:
        - addColumn:
            tableName: jogo
            columns:
              - column:
                  name: estoque_minimo
                  type: NUMERIC(18,3)

  - changeSet:
      id: 003-05
      author: curso-spring-2026
      changes:
        - update:
            tableName: jogo
            columns:
              - column:
                  name: estoque_minimo
                  valueNumeric: 0
            where: estoque_minimo IS NULL

  - changeSet:
      id: 003-06
      author: curso-spring-2026
      changes:
        - addNotNullConstraint:
            tableName: jogo
            columnName: estoque_minimo
            columnDataType: NUMERIC(18,3)

  - changeSet:
      id: 003-07
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE jogo
              ADD CONSTRAINT ck_jogo_estoque_minimo_nao_negativo
              CHECK (estoque_minimo >= 0);

  - changeSet:
      id: 003-08
      author: curso-spring-2026
      changes:
        - addColumn:
            tableName: jogo
            columns:
              - column:
                  name: fornecedor_id
                  type: BIGINT

  - changeSet:
      id: 003-09
      author: curso-spring-2026
      changes:
        - addForeignKeyConstraint:
            baseTableName: jogo
            baseColumnNames: fornecedor_id
            referencedTableName: fornecedor
            referencedColumnNames: id
            constraintName: fk_jogo_fornecedor
            onDelete: RESTRICT
            onUpdate: RESTRICT
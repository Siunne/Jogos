databaseChangeLog:
  - changeSet:
      id: 003-01
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: fornecedor
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_fornecedor

              - column:
                  name: razao_social
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: cnpj
                  type: VARCHAR(14)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: fornecedor

  - changeSet:
      id: 003-02
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE fornecedor
              ADD CONSTRAINT ck_fornecedor_status
              CHECK (status IN ('ATIVO', 'INATIVO'));
      rollback:
        - sql:
            sql: >
              ALTER TABLE fornecedor
              DROP CONSTRAINT ck_fornecedor_status;

  - changeSet:
      id: 003-03
      author: curso-spring-2026
      changes:
        - addUniqueConstraint:
            tableName: fornecedor
            columnNames: cnpj
            constraintName: uk_fornecedor_cnpj
      rollback:
        - dropUniqueConstraint:
            tableName: fornecedor
            constraintName: uk_fornecedor_cnpj

  - changeSet:
      id: 003-04
      author: curso-spring-2026
      changes:
        - addColumn:
            tableName: jogo
            columns:
              - column:
                  name: estoque_minimo
                  type: NUMERIC(18,3)
      rollback:
        - dropColumn:
            tableName: jogo
            columnName: estoque_minimo

  - changeSet:
      id: 003-05
      author: curso-spring-2026
      changes:
        - update:
            tableName: jogo
            columns:
              - column:
                  name: estoque_minimo
                  valueNumeric: 0
            where: estoque_minimo IS NULL
      rollback:
        - sql:
            sql: >
              UPDATE jogo
              SET estoque_minimo = NULL
              WHERE estoque_minimo = 0;

  - changeSet:
      id: 003-06
      author: curso-spring-2026
      changes:
        - addNotNullConstraint:
            tableName: jogo
            columnName: estoque_minimo
            columnDataType: NUMERIC(18,3)
      rollback:
        - dropNotNullConstraint:
            tableName: jogo
            columnName: estoque_minimo
            columnDataType: NUMERIC(18,3)

  - changeSet:
      id: 003-07
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE jogo
              ADD CONSTRAINT ck_jogo_estoque_minimo_nao_negativo
              CHECK (estoque_minimo >= 0);
      rollback:
        - sql:
            sql: >
              ALTER TABLE jogo
              DROP CONSTRAINT ck_jogo_estoque_minimo_nao_negativo;

  - changeSet:
      id: 003-08
      author: curso-spring-2026
      changes:
        - addColumn:
            tableName: jogo
            columns:
              - column:
                  name: fornecedor_id
                  type: BIGINT
      rollback:
        - dropColumn:
            tableName: jogo
            columnName: fornecedor_id

  - changeSet:
      id: 003-09
      author: curso-spring-2026
      changes:
        - addForeignKeyConstraint:
            baseTableName: jogo
            baseColumnNames: fornecedor_id
            referencedTableName: fornecedor
            referencedColumnNames: id
            constraintName: fk_jogo_fornecedor
            onDelete: RESTRICT
            onUpdate: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: jogo
            constraintName: fk_jogo_fornecedor
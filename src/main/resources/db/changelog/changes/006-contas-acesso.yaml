databaseChangeLog:
  - changeSet:
      id: 006-1-conta-acesso
      author: emilly
      changes:
        - sql:
            sql: |
              CREATE TABLE conta_acesso (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY CONSTRAINT pk_conta_acesso PRIMARY KEY,
                pessoa_id BIGINT NOT NULL CONSTRAINT uk_conta_acesso_pessoa UNIQUE,
                login VARCHAR(80) NOT NULL,
                senha_hash VARCHAR(255) NOT NULL,
                status VARCHAR(20) NOT NULL,
                CONSTRAINT fk_conta_acesso_pessoa FOREIGN KEY (pessoa_id) REFERENCES pessoa(id) ON DELETE RESTRICT
              );
      rollback:
        - sql:
            sql: DROP TABLE conta_acesso;
  - changeSet:
      id: 006-2-perfis
      author: emilly
      changes:
        - sql:
            sql: |
              CREATE TABLE conta_acesso_perfil (
                conta_acesso_id BIGINT NOT NULL,
                perfil VARCHAR(30) NOT NULL,
                CONSTRAINT pk_conta_acesso_perfil PRIMARY KEY (conta_acesso_id, perfil),
                CONSTRAINT fk_conta_acesso_perfil FOREIGN KEY (conta_acesso_id) REFERENCES conta_acesso(id) ON DELETE CASCADE
              );
      rollback:
        - sql:
            sql: DROP TABLE conta_acesso_perfil;
  - changeSet:
      id: 006-3-login-unico
      author: emilly
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX uk_conta_acesso_login_lower ON conta_acesso (LOWER(BTRIM(login)));
      rollback:
        - sql:
            sql: DROP INDEX uk_conta_acesso_login_lower;
  - changeSet:
      id: 006-4-status
      author: emilly
      changes:
        - sql:
            sql: ALTER TABLE conta_acesso ADD CONSTRAINT ck_conta_acesso_status CHECK (status IN ('ATIVA','BLOQUEADA'));
      rollback:
        - sql:
            sql: ALTER TABLE conta_acesso DROP CONSTRAINT ck_conta_acesso_status;
  - changeSet:
      id: 006-5-perfil
      author: emilly
      changes:
        - sql:
            sql: ALTER TABLE conta_acesso_perfil ADD CONSTRAINT ck_conta_acesso_perfil CHECK (perfil IN ('OPERADOR','ADMINISTRADOR'));
      rollback:
        - sql:
            sql: ALTER TABLE conta_acesso_perfil DROP CONSTRAINT ck_conta_acesso_perfil;
  - changeSet:
      id: 006-6-login-formato
      author: emilly
      changes:
        - sql:
            sql: ALTER TABLE conta_acesso ADD CONSTRAINT ck_conta_acesso_login CHECK (BTRIM(login) ~ '^[A-Za-z0-9._-]{3,80}$');
      rollback:
        - sql:
            sql: ALTER TABLE conta_acesso DROP CONSTRAINT ck_conta_acesso_login;
  - changeSet:
      id: 006-7-hash
      author: emilly
      changes:
        - sql:
            sql: ALTER TABLE conta_acesso ADD CONSTRAINT ck_conta_acesso_hash CHECK (senha_hash ~ '^[{]bcrypt[}][$]2[aby][$][0-9]{2}[$][./A-Za-z0-9]{53}$');
      rollback:
        - sql:
            sql: ALTER TABLE conta_acesso DROP CONSTRAINT ck_conta_acesso_hash;
